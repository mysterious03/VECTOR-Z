    <text x="32" y="194" fill="#BBB" font-family="'Segoe UI', Roboto, sans-serif" font-size="9">Active NPU Shield:</text>
    <text x="228" y="194" fill="#00E5FF" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" text-anchor="end">120 FPS ARMED</text>

    <text x="32" y="216" fill="#BBB" font-family="'Segoe UI', Roboto, sans-serif" font-size="9">RAM Leakage:</text>
    <text x="228" y="216" fill="#00E676" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" text-anchor="end">0.00 KB (Zero-Log)</text>

    <text x="32" y="238" fill="#BBB" font-family="'Segoe UI', Roboto, sans-serif" font-size="9">Rogue APK Scans:</text>
    <text x="228" y="238" fill="#FFB74D" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" text-anchor="end">0 DETECTED</text>

