    <text x="32" y="142" fill="#8E8E9E" font-family="'Segoe UI', Roboto, sans-serif" font-size="8.5">Lockscreen Trust Health Status</text>
    
    <line x1="32" y1="152" x2="228" y2="152" stroke="#222233" stroke-width="1" />

