    <text x="28" y="246" fill="#888" font-family="'Segoe UI', Roboto, sans-serif" font-size="8">TARGET: <tspan fill="#FF5252" font-family="'JetBrains Mono', monospace">refund-desk@fakebank</tspan></text>
    <text x="28" y="262" fill="#888" font-family="'Segoe UI', Roboto, sans-serif" font-size="8">PROOF: <tspan fill="#00E5FF" font-family="'JetBrains Mono', monospace">ECDSA_STRONGBOX_OK</tspan></text>

