<svg width="960" height="600" viewBox="0 0 960 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgShowcase" x1="0" y1="0" x2="960" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#07070B" />
      <stop offset="50%" stop-color="#0F0F17" />
      <stop offset="100%" stop-color="#07070B" />
    </linearGradient>
    <linearGradient id="chassisGrad" x1="0" y1="0" x2="320" y2="560" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2D2D3A" />
      <stop offset="50%" stop-color="#1A1A24" />
      <stop offset="100%" stop-color="#12121A" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0" y1="0" x2="300" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0A0A0F" />
      <stop offset="100%" stop-color="#12121B" />
    </linearGradient>
    <linearGradient id="redAlertGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF1744" />
      <stop offset="100%" stop-color="#D50000" />
    </linearGradient>
    <linearGradient id="cyanNeon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#00B0FF" />
    </linearGradient>
    <linearGradient id="orangeGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF6D00" />
      <stop offset="100%" stop-color="#FF3D00" />
    </linearGradient>
    <filter id="phoneShadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#00E5FF" flood-opacity="0.15" />
      <feDropShadow dx="0" dy="15" stdDeviation="15" flood-color="#000000" flood-opacity="0.9" />
    </filter>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
