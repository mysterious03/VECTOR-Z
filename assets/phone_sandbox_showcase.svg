        <rect width="240" height="100" rx="12" fill="#12121B" stroke="#252538" stroke-width="1" />
        <circle cx="24" cy="24" r="12" fill="#361C00" />
        <text x="24" y="29" fill="#FF9100" font-size="12" text-anchor="middle">🔍</text>
        <text x="44" y="28" fill="#FFFFFF" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">QR Quishing Unwrapper</text>
        <text x="14" y="52" fill="#9999AA" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5">Recursively unwraps short links &amp; Cyrillic homoglyph domains.</text>
        <text x="14" y="75" fill="#FF5252" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">🛑 Zero-Hop Trojan Defense</text>
