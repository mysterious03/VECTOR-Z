        <text x="20" y="28" fill="#FFFFFF" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800">🚀 TEST IN YOUR BROWSER: 13-STEP INTERACTIVE SIMULATOR</text>
