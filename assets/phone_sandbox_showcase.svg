        <text x="14" y="52" fill="#9999AA" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5">Aadhaar, PAN &amp; Passkeys locked in hardware with memory scrubbers.</text>
        <text x="14" y="75" fill="#00E676" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">🛡️ Ephemeral Zero-RAM</text>
