      <path d="M0 9 L3 9 L3 12 L0 12 Z M4 6 L7 6 L7 12 L4 12 Z M8 3 L11 3 L11 12 L8 12 Z M12 0 L15 0 L15 12 L12 12 Z" fill="#00E5FF" />
