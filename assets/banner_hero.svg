<svg width="900" height="340" viewBox="0 0 900 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="900" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#08080C" />
      <stop offset="50%" stop-color="#12121A" />
      <stop offset="100%" stop-color="#08080C" />
    </linearGradient>
    <linearGradient id="neonOrange" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF7700" />
      <stop offset="100%" stop-color="#FF3300" />
    </linearGradient>
    <linearGradient id="neonCyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#00B0FF" />
    </linearGradient>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowOrange" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas with grid pattern -->
  <rect width="900" height="340" rx="16" fill="url(#bgGrad)" stroke="#222230" stroke-width="2"/>
  
  <!-- Subtle Grid lines -->
  <path d="M0 60 H900 M0 120 H900 M0 180 H900 M0 240 H900 M0 300 H900" stroke="#1A1A26" stroke-width="1" />
  <path d="M150 0 V340 M300 0 V340 M450 0 V340 M600 0 V340 M750 0 V340" stroke="#1A1A26" stroke-width="1" />

  <!-- Top Pill / Hackathon Badge -->
  <g transform="translate(50, 35)">
    <rect width="360" height="28" rx="14" fill="#1C1B29" stroke="#FF5500" stroke-width="1" />
    <circle cx="16" cy="14" r="5" fill="#00E5FF" />
    <text x="30" y="18" fill="#FF8833" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-size="11" font-weight="800" letter-spacing="1.2">iQOO HACKATHON 2026 • FINTECH + COMMERCE</text>
  </g>

  <!-- Title VECTOR-Z -->
  <text x="50" y="125" fill="#FFFFFF" font-family="'Segoe UI', Roboto, 'Montserrat', sans-serif" font-size="52" font-weight="900" letter-spacing="-1">
    VECTOR-<tspan fill="url(#neonOrange)" filter="url(#glowOrange)">Z</tspan>
  </text>

  <!-- Tagline -->
  <text x="50" y="165" fill="#00E5FF" font-family="'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="600" letter-spacing="0.5" filter="url(#glowCyan)">
    "Trust before action."
  </text>

  <!-- Subtitle -->
  <text x="50" y="200" fill="#9E9EA7" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400">
    On-Device AI Trust Infrastructure for Android • 100% Air-Gapped Qualcomm Hexagon NPU
  </text>

  <!-- Feature Pills Bottom -->
  <g transform="translate(50, 240)">
    <!-- Pill 1 -->
    <rect width="180" height="56" rx="10" fill="#14141E" stroke="#2D2D42" stroke-width="1"/>
    <text x="16" y="24" fill="#00E5FF" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">PAYMENT GUARD</text>
    <text x="16" y="42" fill="#FFFFFF" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Anti-UPI PIN Scam</text>

    <!-- Pill 2 -->
    <g transform="translate(195, 0)">
      <rect width="180" height="56" rx="10" fill="#14141E" stroke="#2D2D42" stroke-width="1"/>
      <text x="16" y="24" fill="#00E676" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">KEYSTORE VAULT</text>
      <text x="16" y="42" fill="#FFFFFF" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">AES-256 Sealed</text>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(390, 0)">
      <rect width="180" height="56" rx="10" fill="#14141E" stroke="#2D2D42" stroke-width="1"/>
      <text x="16" y="24" fill="#FF9100" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">COMMERCE GUARD</text>
      <text x="16" y="42" fill="#FFFFFF" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Price Reality &amp; Terms</text>
    </g>

    <!-- Pill 4 -->
    <g transform="translate(585, 0)">
      <rect width="210" height="56" rx="10" fill="#14141E" stroke="#FF5500" stroke-width="1"/>
      <text x="16" y="24" fill="#FF5500" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">NPU LATENCY</text>
      <text x="16" y="42" fill="#00E5FF" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800">1.84 ms • 0 Cloud</text>
    </g>
  </g>

  <!-- Right Visual Hologram Badge -->
  <g transform="translate(680, 45)">
    <circle cx="90" cy="75" r="70" fill="#151424" stroke="#00E5FF" stroke-width="2" stroke-dasharray="8 4"/>
    <circle cx="90" cy="75" r="52" fill="#0C0C14" stroke="#FF5500" stroke-width="1.5"/>
    <path d="M90 40 L125 55 V90 C125 110 90 125 90 125 C90 125 55 110 55 90 V55 L90 40 Z" fill="url(#neonOrange)" opacity="0.85"/>
    <text x="90" y="93" fill="#FFFFFF" font-family="'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" text-anchor="middle">Z</text>
  </g>
</svg>
